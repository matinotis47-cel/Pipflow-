services:
  - type: web
    name: pipflow-trading-platform
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_CLIENT_SECRET
        sync: false
      - key: DERIV_REDIRECT_URI
        sync: false
      - key: DERIV_AUTH_BASE
        value: https://auth.deriv.com
      - key: DERIV_API_BASE
        value: https://api.deriv.com
      - key: DERIV_API_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: noreply@pipflow.site
      - key: BREVO_SENDER_NAME
        value: PIPFLOW Trading
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@pipflow.site
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
